name: Build and push zi2zi-JiT inference worker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - handler.py
      - requirements.inference.txt
      - .github/workflows/docker-image.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          docker system prune -af || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: illusate/fontfoundry-zi2zi:latest
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
